name: release

# Three tag shapes are supported so the agent and the panel can be upgraded
# independently, while a plain version tag still publishes both:
#
#   agent-v0.1.1   only the agent binaries and its container image
#   panel-v0.1.1   only the panel binaries and its container image
#   v0.1.1         both, as a coordinated release
#
# Any tag carrying a pre-release suffix (-rc1, -beta.2, ...) is published as a
# GitHub pre-release, so an in-progress build is never mistaken for the current
# stable version. The binaries themselves are always complete builds; a release
# never ships a patch.
on:
  push:
    tags:
      - "v*"
      - "agent-v*"
      - "panel-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (for example v0.1.1, agent-v0.1.1, panel-v0.1.1)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # Decide what the tag asks for. Every downstream job reads these outputs, so
  # the tag conventions live in exactly one place.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      build_agent: ${{ steps.plan.outputs.build_agent }}
      build_panel: ${{ steps.plan.outputs.build_panel }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - id: plan
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          tag="$RAW_TAG"
          case "$tag" in
            agent-v*) build_agent=true;  build_panel=false; prefix="agent-v" ;;
            panel-v*) build_agent=false; build_panel=true;  prefix="panel-v" ;;
            v*)       build_agent=true;  build_panel=true;  prefix="v" ;;
            *) echo "unsupported tag shape: $tag" >&2; exit 1 ;;
          esac
          version="${tag#"$prefix"}"

          # Anything with a pre-release suffix is not the stable release.
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          echo "tag=$tag"                    >> "$GITHUB_OUTPUT"
          echo "version=$version"            >> "$GITHUB_OUTPUT"
          echo "build_agent=$build_agent"    >> "$GITHUB_OUTPUT"
          echo "build_panel=$build_panel"    >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease"      >> "$GITHUB_OUTPUT"
          echo "plan: tag=$tag version=$version agent=$build_agent panel=$build_panel prerelease=$prerelease"

  # Everything is built in one job per architecture so the two binaries always
  # come from the same commit and toolchain.
  binaries:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          BUILD_AGENT: ${{ needs.plan.outputs.build_agent }}
          BUILD_PANEL: ${{ needs.plan.outputs.build_panel }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          # The version is stamped in, so `-version` reports the release tag
          # rather than a placeholder compiled into the source.
          ldflags="-s -w -X main.version=${VERSION}"


          if [ "$BUILD_AGENT" = "true" ]; then
            go build -trimpath -ldflags "$ldflags" \
              -o "dist/smart-gateway-agent-${GOOS}-${GOARCH}" ./cmd/smart-gateway-agent
          fi
          if [ "$BUILD_PANEL" = "true" ]; then
            go build -trimpath -ldflags "$ldflags" \
              -o "dist/smart-gateway-panel-${GOOS}-${GOARCH}" ./cmd/smart-gateway-panel
          fi

          ls -la dist
          (cd dist && sha256sum smart-gateway-* > "checksums-${GOOS}-${GOARCH}.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # A release always carries the checksums and the installer, so an operator can
  # fetch everything from one place.
  extras:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-artifact@v4
        with:
          name: dist-extras
          path: |
            internal/panel/ui/install.sh
            docker-compose.yml
            .env.example

  # The panel proxies these assets so a node installer can fetch everything
  # from a single origin.
  publish:
    needs: [plan, binaries, extras]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.plan.outputs.prerelease }}
          tag_name: ${{ needs.plan.outputs.tag }}

  # Container images live in GHCR, which shares the repository's permissions, so
  # no extra credential is needed. The agent and panel are separate images so a
  # node can pull only what it runs.
  image:
    needs: [plan, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent image
        if: needs.plan.outputs.build_agent == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: agent
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}/agent:${{ needs.plan.outputs.version }}
            ghcr.io/${{ github.repository }}/agent:latest

      - name: Build and push panel image
        if: needs.plan.outputs.build_panel == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: panel
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}/panel:${{ needs.plan.outputs.version }}
            ghcr.io/${{ github.repository }}/panel:latest
